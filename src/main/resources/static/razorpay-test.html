<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Razorpay Test Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<h2>Razorpay Test Payment</h2>

<label>Account ID</label><br>
<input type="text" id="accountId" style="width: 420px;"><br><br>

<label>Amount</label><br>
<input type="number" id="amount" value="300"><br><br>

<label>Payment Method</label><br>
<select id="paymentMethod">
    <option value="UPI">UPI</option>
    <option value="CARD">CARD</option>
    <option value="NET_BANKING">NET_BANKING</option>
    <option value="BANK_TRANSFER">BANK_TRANSFER</option>
</select>

<br><br>

<button onclick="startPayment()">Pay</button>

<p id="status"></p>

<script>
    async function startPayment() {

        const accountId = document.getElementById("accountId").value.trim();
        const amount = Number(document.getElementById("amount").value);
        const paymentMethod = document.getElementById("paymentMethod").value;
        const statusElement = document.getElementById("status");

        if (!accountId) {
            statusElement.innerText = "Account ID is required";
            return;
        }

        try {

            statusElement.innerText = "Creating payment...";

            const configResponse = await fetch(
                "/api/v1/payments/gateway/config"
            );

            if (!configResponse.ok) {
                throw new Error("Unable to load Razorpay configuration");
            }

            const config = await configResponse.json();

            const paymentResponse = await fetch(
                `/api/v1/accounts/${accountId}/payments`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        amount: amount,
                        paymentMethod: paymentMethod
                    })
                }
            );

            if (!paymentResponse.ok) {
                const error = await paymentResponse.text();
                throw new Error(error);
            }

            const payment = await paymentResponse.json();

            statusElement.innerText =
                "Payment created: " + payment.paymentReference;

            const options = {
                key: config.keyId,
                amount: Math.round(payment.amount * 100),
                currency: "INR",
                name: "Enterprise Billing Platform",
                description: payment.paymentReference,
                order_id: payment.gatewayOrderId,

                handler: async function (response) {

                    statusElement.innerText =
                        "Payment completed. Verifying...";

                    const verifyResponse = await fetch(
                        `/api/v1/accounts/${accountId}/payments/${payment.paymentId}/verify`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                gatewayOrderId:
                                response.razorpay_order_id,

                                gatewayPaymentId:
                                response.razorpay_payment_id,

                                signature:
                                response.razorpay_signature
                            })
                        }
                    );

                    if (!verifyResponse.ok) {
                        const error = await verifyResponse.text();
                        throw new Error(error);
                    }

                    const verifiedPayment =
                        await verifyResponse.json();

                    statusElement.innerText =
                        "Payment verified successfully. Status: "
                        + verifiedPayment.status;
                },

                theme: {}
            };

            const razorpay = new Razorpay(options);

            razorpay.on("payment.failed", function () {
                statusElement.innerText = "Payment failed";
            });

            razorpay.open();

        } catch (error) {
            console.error(error);
            statusElement.innerText =
                "Error: " + error.message;
        }
    }
</script>

</body>
</html>
